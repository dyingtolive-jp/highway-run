<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HIGHWAY RUN ★ DYINGTOLIVE</title>
<meta name="description" content="Dodge Hellcats on the midnight highway in a stanced S15. A DYINGTOLIVE joint.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#040405; font-family:'Arial Black',Arial,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #game { display:block; width:100vw; height:100vh; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,.84); z-index:10; text-align:center; padding:20px; }
  .hidden { display:none !important; }
  h1.title { font-size:clamp(40px,9vw,92px); letter-spacing:4px; line-height:.95;
    background:linear-gradient(180deg,#fff 0%,#c9c9d4 40%,#6a6a75 60%,#e8e8f0 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 18px rgba(200,200,220,.25)); margin-bottom:6px; }
  .subtitle { color:#7CFF6B; letter-spacing:6px; font-size:clamp(11px,2.4vw,16px); margin-bottom:10px; }
  .tagline { color:#888; letter-spacing:2px; font-size:12px; margin-bottom:24px; font-family:Arial,sans-serif; font-weight:bold; }
  .controls-hint { color:#999; font-size:13px; letter-spacing:2px; line-height:2; margin-bottom:28px; font-family:Arial,sans-serif; font-weight:bold; }
  .controls-hint b { color:#fff; }
  .bigbtn { background:linear-gradient(180deg,#f2f2f6,#c9c9d4 55%,#a9a9b4); color:#000; border:none; cursor:pointer;
    font-family:'Arial Black',Arial,sans-serif; letter-spacing:3px; font-size:20px; padding:16px 54px; text-transform:uppercase;
    box-shadow:0 6px 30px rgba(200,200,220,.3); transition:transform .12s ease; }
  .bigbtn:active { transform:scale(.96); }
  #finalScore { font-size:clamp(30px,6vw,54px); color:#fff; letter-spacing:3px; margin:8px 0 2px; }
  #finalBest { color:#7CFF6B; letter-spacing:3px; font-size:15px; margin-bottom:24px; }
  #crashMsg { color:#ff5b5b; letter-spacing:4px; font-size:clamp(16px,3.4vw,24px); margin-bottom:4px; }
  .brand { position:fixed; bottom:12px; width:100%; text-align:center; color:#444; font-size:11px; letter-spacing:4px; z-index:5; pointer-events:none; }
  #pop { position:fixed; top:20%; width:100%; text-align:center; z-index:6; pointer-events:none;
    font-size:clamp(24px,5vw,48px); letter-spacing:4px; color:#7CFF6B;
    text-shadow:0 0 24px rgba(124,255,107,.6); opacity:0; transition:opacity .25s ease; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="pop"></div>

<div class="overlay" id="startScreen">
  <h1 class="title">HIGHWAY<br>RUN</h1>
  <div class="subtitle">★ DYINGTOLIVE ★</div>
  <div class="tagline">STANCED S15 // MIDNIGHT // NO BRAKES</div>
  <div class="controls-hint">
    <b>← →</b> / <b>A D</b> — SWITCH LANES<br>
    TAP LEFT / RIGHT SIDE ON PHONE<br>
    NO THROTTLE. IT ONLY GETS FASTER.<br>
    DODGE THE HELLCATS.
  </div>
  <button class="bigbtn" id="startBtn">SEND IT</button>
</div>

<div class="overlay hidden" id="overScreen">
  <div id="crashMsg">WRECKED</div>
  <h1 class="title" style="font-size:clamp(30px,6vw,60px)">GAME OVER</h1>
  <div id="finalScore">0</div>
  <div id="finalBest">BEST: 0</div>
  <button class="bigbtn" id="retryBtn">RUN IT BACK</button>
</div>

<div class="brand">DYINGTOLIVE.JP ★ STATIC BUILDS ONLY</div>

<script>
'use strict';
/* ============ HIGHWAY RUN x DYINGTOLIVE ============ */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
window.addEventListener('resize', resize);

/* ---------- layout ---------- */
let roadW, roadX, laneW, laneX = [];
function layout() {
  roadW = Math.min(W * 0.78, 460);
  roadX = (W - roadW) / 2;
  laneW = roadW / 3;
  laneX = [0, 1, 2].map(i => roadX + laneW * (i + 0.5));
}

/* ---------- state ---------- */
const S = {
  mode: 'menu', t: 0,
  speed: 0, baseSpeed: 8.5, maxSpeed: 24,
  dist: 0, score: 0, nearMiss: 0,
  player: { lane: 1, x: 0, tx: 0 },
  npcs: [], boards: [], poles: [], parts: [],
  shake: 0, lastFree: 1, sinceSpawn: 9999,
  best: parseInt(localStorage.getItem('dtl_highway_best') || '0', 10)
};
const CAR_W = 56, CAR_H = 108;

function reset() {
  S.t = 0; S.speed = S.baseSpeed; S.dist = 0; S.score = 0; S.nearMiss = 0;
  S.player = { lane: 1, x: laneX[1], tx: laneX[1] };
  S.npcs = []; S.boards = []; S.poles = []; S.parts = [];
  S.shake = 0; S.lastFree = 1; S.sinceSpawn = 9999; S.laneAge = [0, 0, 0]; S.squirm = 0;
  // pre-fill roadside
  for (let y = -100; y < H + 200; y += 130) S.poles.push({ y, side: (y / 130) % 2 ? 1 : -1 });
  for (let i = 0; i < 4; i++) S.boards.push({ y: -i * 900 - 300, side: i % 2 ? 1 : -1, ad: i % 4 });
}

/* ---------- input ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (S.mode === 'play') {
    if (e.key === 'ArrowLeft' || e.key === 'a') moveLane(-1);
    if (e.key === 'ArrowRight' || e.key === 'd') moveLane(1);
  } else if (e.key === 'Enter' || e.key === ' ') startGame();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function moveLane(d) {
  const p = S.player;
  const nl = Math.max(0, Math.min(2, p.lane + d));
  if (nl !== p.lane) {
    p.lane = nl; p.tx = laneX[nl];
    // heavy tire smoke off the rear wheels + small camera kick
    const py = H * 0.86;
    for (let i = 0; i < 22; i++) {
      S.parts.push({
        x: p.x + (Math.random() - .5) * 44, y: py + 26 + Math.random() * 14,
        vx: (Math.random() - .5) * 4 - d * 3, vy: 0.8 + Math.random() * 2.4,
        life: 30 + Math.random() * 24, color: 'rgba(210,210,218,.5)', s: 5 + Math.random() * 6
      });
    }
    S.shake = Math.max(S.shake, 2.5);
  }
}
// touch: tap left/right third, or swipe
let tsX = 0;
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  tsX = e.changedTouches[0].clientX;
  if (S.mode !== 'play') return;
  const x = e.changedTouches[0].clientX;
  if (x < W * 0.4) moveLane(-1);
  else if (x > W * 0.6) moveLane(1);
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if (S.mode !== 'play') return;
  const x = e.changedTouches[0].clientX;
  if (x - tsX > 34) { moveLane(1); tsX = x; }
  else if (x - tsX < -34) { moveLane(-1); tsX = x; }
}, { passive: false });

/* ---------- spawning: always a way through ----------
   - never blocks all 3 lanes
   - the free lane is always adjacent to (or the same as) the last wave's free lane
   - waves are spaced by distance so you always have time to cut across */
const HELLCAT_COLORS = ['#15151a', '#8f1212', '#d8d8de', '#3d1a5c', '#b35c12', '#2a2d33', '#101014'];
function spawnWave() {
  // every lane has an age (waves since it last had a car) — the stalest lane MUST be blocked.
  // this forces all 3 lanes (including center) into regular rotation.
  S.laneAge = S.laneAge || [0, 0, 0];
  S.laneAge = S.laneAge.map(a => a + 1);
  let mustBlock = 0;
  for (let l = 1; l < 3; l++) if (S.laneAge[l] > S.laneAge[mustBlock]) mustBlock = l;
  // free lane: within 1 of last free (always reachable) and never the must-block lane
  const lastFree = S.lastFree;
  const freeOpts = [0, 1, 2].filter(l => l !== mustBlock && Math.abs(l - lastFree) <= 1);
  const freeLane = freeOpts[Math.random() * freeOpts.length | 0];
  // block the stalest lane, plus a second car 45% of the time (never all 3)
  const others = [0, 1, 2].filter(l => l !== freeLane && l !== mustBlock).sort(() => Math.random() - 0.5);
  const blocked = [mustBlock].concat(Math.random() < 0.45 && others.length ? [others[0]] : []);
  for (let i = 0; i < blocked.length; i++) {
    const lane = blocked[i];
    S.laneAge[lane] = 0;
    const r = Math.random();
    let type = 'hellcat';
    if (r > 0.82) type = Math.random() < 0.5 ? 'truck' : 'sedan'; // ~18% variety
    const npcSpeed = S.speed * (0.32 + Math.random() * 0.22);
    S.npcs.push({
      lane, x: laneX[lane], y: -520 - i * (140 + Math.random() * 90),
      w: type === 'truck' ? CAR_W + 14 : CAR_W,
      h: type === 'truck' ? CAR_H + 46 : CAR_H,
      type, color: HELLCAT_COLORS[Math.random() * HELLCAT_COLORS.length | 0],
      npcSpeed, passed: false
    });
  }
  S.lastFree = freeLane;
  S.sinceSpawn = 0;
}

/* ---------- particles / popups ---------- */
function burst(x, y, n, color) {
  for (let i = 0; i < n; i++)
    S.parts.push({ x, y, vx: (Math.random() - .5) * 8, vy: (Math.random() - .5) * 8 - 2, life: 26 + Math.random() * 22, color, s: 2 + Math.random() * 3 });
}
const popEl = document.getElementById('pop');
let popTimer = null;
function pop(txt, color) {
  popEl.textContent = txt;
  popEl.style.color = color || '#7CFF6B';
  popEl.style.opacity = 1;
  clearTimeout(popTimer);
  popTimer = setTimeout(() => popEl.style.opacity = 0, 800);
}

/* ---------- update ---------- */
function update(dt) {
  S.t += dt;
  // throttle you can't control
  S.speed = Math.min(S.maxSpeed, S.speed + dt * 0.011);
  S.dist += S.speed * dt;

  const p = S.player;
  p.x += (p.tx - p.x) * Math.min(1, dt * 0.30);
  const py = H * 0.86;
  // squirm + traction loss while cutting across lanes
  const changing = Math.abs(p.tx - p.x) > 5 ? 1 : 0;
  S.squirm = changing;
  if (changing) {
    S.speed = Math.max(S.baseSpeed, S.speed - dt * 0.03);
    if (Math.random() < 0.55) {
      for (let k = 0; k < 2; k++) {
        S.parts.push({
          x: p.x + (Math.random() - .5) * 40, y: py + 28 + Math.random() * 10,
          vx: (Math.random() - .5) * 3, vy: 1 + Math.random() * 2,
          life: 22 + Math.random() * 16, color: 'rgba(210,210,218,.42)', s: 4 + Math.random() * 5
        });
      }
    }
  }

  // spawn by distance: next wave only when the last one is far enough ahead
  // that you can always cut across in time — gap grows with speed
  S.sinceSpawn += S.speed * dt;
  const minGap = 430 + S.speed * 17;
  if (S.sinceSpawn >= minGap) spawnWave();

  // npcs
  const hitShrink = 0.72;
  for (let i = S.npcs.length - 1; i >= 0; i--) {
    const n = S.npcs[i];
    n.y += (S.speed - n.npcSpeed) * dt;
    if (n.y > H + 220) { S.npcs.splice(i, 1); continue; }
    // near miss: passed player line without hitting
    if (!n.passed && n.y - n.h / 2 > py + CAR_H / 2) {
      n.passed = true;
      const gap = Math.abs(n.x - p.x) - (n.w + CAR_W) / 2;
      if (gap < 34 && gap > -10) {
        S.nearMiss++; S.score += 60;
        pop('CLOSE +' + 60);
        S.shake = Math.max(S.shake, 3);
        burst(p.x, py - 40, 6, '#7CFF6B');
      }
    }
    // collision (steady full-size hitboxes)
    const pw = CAR_W * hitShrink, ph = CAR_H * hitShrink;
    const nw = n.w * hitShrink, nh = n.h * hitShrink;
    if (Math.abs(n.x - p.x) < (pw + nw) / 2 && Math.abs(n.y - py) < (ph + nh) / 2) {
      die(); return;
    }
  }

  // roadside scroll
  const dy = S.speed * dt;
  for (const pl of S.poles) { pl.y += dy; if (pl.y > H + 60) { pl.y -= H + 260; pl.side *= -1; } }
  for (const b of S.boards) { b.y += dy; if (b.y > H + 120) { b.y -= H + 1900; b.side *= -1; b.ad = (b.ad + 1) % 4; } }

  // particles
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const pt = S.parts[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt + S.speed * 0.4 * dt;
    pt.vy += 0.12 * dt; pt.life -= dt;
    if (pt.life <= 0) S.parts.splice(i, 1);
  }
  // exhaust flames — grow with speed
  const heat = Math.max(0, Math.min(1, (S.speed - S.baseSpeed) / (S.maxSpeed - S.baseSpeed)));
  if (Math.random() < 0.22 + heat * 0.68) {
    const cols = ['#ffd94d', '#ff9030', '#ff4d00', '#ff4d00', '#6db4ff'];
    S.parts.push({
      x: p.x - 13 + (Math.random() - .5) * 6, y: py + CAR_H / 2 - 2,
      vx: (Math.random() - .5) * 1.6, vy: 2.5 + Math.random() * 3 + heat * 2.5,
      life: 9 + Math.random() * 9, color: cols[Math.random() * cols.length | 0],
      s: 2.5 + heat * 5 + Math.random() * 2
    });
  }
  // exhaust puffs
  if (S.t % 5 < dt && S.speed > 12) burst(p.x + (Math.random() - .5) * 20, py + CAR_H / 2, 1, 'rgba(140,140,150,.35)');

  // camera rumble grows with speed; kicks (lane change, near miss, crash) decay on top
  const rumble = heat * 2.6;
  S.shake = Math.max(rumble, S.shake - dt * 1.4);
  S.score += S.speed * dt * 0.12;
}

function die() {
  S.mode = 'dead';
  S.shake = 16;
  const p = S.player, py = H * 0.86;
  burst(p.x, py, 34, '#ff5b5b');
  burst(p.x, py, 22, '#ffb14d');
  burst(p.x, py, 18, '#c9c9d4');
  const sc = Math.floor(S.score);
  if (sc > S.best) { S.best = sc; localStorage.setItem('dtl_highway_best', String(sc)); }
  document.getElementById('crashMsg').textContent = S.nearMiss > 4 ? 'SENT IT TOO HARD' : 'WRECKED';
  document.getElementById('finalScore').textContent = sc.toLocaleString();
  document.getElementById('finalBest').textContent = 'BEST ' + S.best.toLocaleString() + ' ★ NEAR MISS x' + S.nearMiss;
  setTimeout(() => document.getElementById('overScreen').classList.remove('hidden'), 700);
}

/* ---------- drawing ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawWheel(x, y, w, h, camber) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(camber);
  ctx.fillStyle = '#0c0c0e';
  rr(-w / 2, -h / 2, w, h, 4); ctx.fill();
  ctx.strokeStyle = '#c9c9d4'; ctx.lineWidth = 2.5;
  rr(-w / 2, -h / 2, w, h, 4); ctx.stroke();
  ctx.fillStyle = '#3a3a42';
  ctx.fillRect(-w / 2 + 3, -h / 2 + 3, w - 6, h - 6);
  ctx.restore();
}

/* stanced S15, facing up */
function drawS15(x, y) {
  const w = CAR_W, h = CAR_H;
  const sq = S.squirm ? Math.sin(S.t * 0.9) * 0.07 : 0; // traction-loss wiggle
  const jx = S.squirm ? Math.sin(S.t * 1.3) * 3 : 0;
  ctx.save();
  ctx.translate(x + jx, y);
  ctx.rotate(sq);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.beginPath(); ctx.ellipse(0, 6, w * 0.72, h * 0.52, 0, 0, 7); ctx.fill();
  // underglow
  ctx.fillStyle = 'rgba(124,255,107,.14)';
  ctx.beginPath(); ctx.ellipse(0, 4, w * 0.85, h * 0.58, 0, 0, 7); ctx.fill();
  // wheels (stanced: poking out, cambered)
  const ww = 15, wh = 26;
  drawWheel(-w / 2 - 2, -h * 0.30, ww, wh, 0.10);
  drawWheel(w / 2 + 2, -h * 0.30, ww, wh, -0.10);
  drawWheel(-w / 2 - 2, h * 0.30, ww, wh, 0.12);
  drawWheel(w / 2 + 2, h * 0.30, ww, wh, -0.12);
  // body
  const bg = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  bg.addColorStop(0, '#0b0b0e'); bg.addColorStop(0.5, '#232329'); bg.addColorStop(1, '#0b0b0e');
  ctx.fillStyle = bg;
  rr(-w / 2, -h / 2, w, h, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(201,201,212,.35)'; ctx.lineWidth = 1.5;
  rr(-w / 2, -h / 2, w, h, 16); ctx.stroke();
  // hood lines
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-w * 0.22, -h / 2 + 8); ctx.lineTo(-w * 0.22, -h * 0.12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(w * 0.22, -h / 2 + 8); ctx.lineTo(w * 0.22, -h * 0.12); ctx.stroke();
  // windshield / roof / rear glass
  ctx.fillStyle = '#0e1620';
  rr(-w * 0.36, -h * 0.10, w * 0.72, h * 0.16, 6); ctx.fill();
  ctx.fillStyle = '#101014';
  rr(-w * 0.38, h * 0.08, w * 0.76, h * 0.14, 6); ctx.fill();
  // ★ cross decal on roof
  ctx.strokeStyle = '#e8e8f0'; ctx.lineWidth = 3;
  const cx = 0, cy = h * 0.15, s = 7;
  ctx.beginPath(); ctx.moveTo(cx, cy - s); ctx.lineTo(cx, cy + s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - s * 0.7, cy); ctx.lineTo(cx + s * 0.7, cy); ctx.stroke();
  ctx.fillStyle = '#0e1620';
  rr(-w * 0.34, h * 0.24, w * 0.68, h * 0.10, 5); ctx.fill();
  // headlights + beam
  ctx.fillStyle = '#fff8d6';
  rr(-w * 0.38, -h / 2 - 2, w * 0.20, 7, 3); ctx.fill();
  rr(w * 0.18, -h / 2 - 2, w * 0.20, 7, 3); ctx.fill();
  const beam = ctx.createLinearGradient(0, -h / 2, 0, -h / 2 - 190);
  beam.addColorStop(0, 'rgba(255,248,214,.20)'); beam.addColorStop(1, 'rgba(255,248,214,0)');
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(-w * 0.42, -h / 2); ctx.lineTo(w * 0.42, -h / 2);
  ctx.lineTo(w * 0.75, -h / 2 - 190); ctx.lineTo(-w * 0.75, -h / 2 - 190);
  ctx.closePath(); ctx.fill();
  // taillight bar
  ctx.fillStyle = '#ff2d2d';
  rr(-w * 0.40, h / 2 - 5, w * 0.80, 6, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,45,45,.35)';
  rr(-w * 0.46, h / 2 - 8, w * 0.92, 12, 6); ctx.fill();
  ctx.restore();
}

/* hellcat (challenger): boxy muscle, facing down */
function drawHellcat(n) {
  const w = n.w, h = n.h;
  // steady full size — fade in at spawn instead of growing
  const fade = Math.max(0, Math.min(1, (n.y + 520) / 220));
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(n.x, n.y);
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.beginPath(); ctx.ellipse(0, 6, w * 0.7, h * 0.52, 0, 0, 7); ctx.fill();
  // wheels
  ctx.fillStyle = '#0c0c0e';
  for (const [wx, wy] of [[-w / 2 - 1, -h * 0.3], [w / 2 + 1, -h * 0.3], [-w / 2 - 1, h * 0.3], [w / 2 + 1, h * 0.3]]) {
    rr(wx - 7, wy - 13, 14, 26, 4); ctx.fill();
    ctx.strokeStyle = '#8a8a94'; ctx.lineWidth = 2;
    rr(wx - 7, wy - 13, 14, 26, 4); ctx.stroke();
  }
  // body
  const bg = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  bg.addColorStop(0, shade(n.color, -24)); bg.addColorStop(0.5, n.color); bg.addColorStop(1, shade(n.color, -24));
  ctx.fillStyle = bg;
  rr(-w / 2, -h / 2, w, h, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.5;
  rr(-w / 2, -h / 2, w, h, 8); ctx.stroke();
  // long hood scoop
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  rr(-w * 0.18, -h * 0.42, w * 0.36, h * 0.16, 4); ctx.fill();
  // glasshouse
  ctx.fillStyle = '#0d141c';
  rr(-w * 0.36, -h * 0.12, w * 0.72, h * 0.20, 6); ctx.fill();
  // NPCs drive the SAME direction as you (you're overtaking) —
  // front points up-screen, so you see dim headlights up top...
  ctx.fillStyle = 'rgba(255,246,207,.45)';
  for (const hx of [-w * 0.28, -w * 0.10, w * 0.10, w * 0.28]) {
    ctx.beginPath(); ctx.arc(hx, -h / 2 + 4, 3.5, 0, 7); ctx.fill();
  }
  // ...and the full-width LED taillight bar facing you (rear = bottom)
  ctx.fillStyle = '#ff2d2d';
  rr(-w * 0.42, h / 2 - 8, w * 0.84, 6, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,45,45,.30)';
  rr(-w * 0.48, h / 2 - 12, w * 0.96, 14, 7); ctx.fill();
  ctx.restore();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}
function drawSedan(n) {
  const fade = Math.max(0, Math.min(1, (n.y + 520) / 220));
  ctx.save(); ctx.globalAlpha = fade; ctx.translate(n.x, n.y);
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.beginPath(); ctx.ellipse(0, 6, n.w * 0.7, n.h * 0.52, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#181820';
  rr(-n.w / 2, -n.h / 2, n.w, n.h, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5;
  rr(-n.w / 2, -n.h / 2, n.w, n.h, 18); ctx.stroke();
  ctx.fillStyle = '#0d141c';
  rr(-n.w * 0.34, -n.h * 0.10, n.w * 0.68, n.h * 0.18, 8); ctx.fill();
  // headlights face away (dim, up top), taillights face you (bright, bottom)
  ctx.fillStyle = 'rgba(255,246,207,.45)';
  rr(-n.w * 0.36, -n.h / 2 + 2, n.w * 0.20, 5, 3); ctx.fill();
  rr(n.w * 0.16, -n.h / 2 + 2, n.w * 0.20, 5, 3); ctx.fill();
  ctx.fillStyle = '#ff2d2d';
  rr(-n.w * 0.38, n.h / 2 - 7, n.w * 0.76, 6, 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,45,45,.30)';
  rr(-n.w * 0.44, n.h / 2 - 11, n.w * 0.88, 13, 6); ctx.fill();
  ctx.restore();
}
function drawTruck(n) {
  const fade = Math.max(0, Math.min(1, (n.y + 520) / 220));
  ctx.save(); ctx.globalAlpha = fade; ctx.translate(n.x, n.y);
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.beginPath(); ctx.ellipse(0, 6, n.w * 0.72, n.h * 0.52, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#20242c';
  rr(-n.w / 2, -n.h / 2, n.w, n.h, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5;
  rr(-n.w / 2, -n.h / 2, n.w, n.h, 6); ctx.stroke();
  ctx.fillStyle = '#14161c';
  rr(-n.w * 0.40, n.h * 0.28, n.w * 0.80, n.h * 0.16, 4); ctx.fill(); // cab
  ctx.fillStyle = '#0d141c';
  rr(-n.w * 0.34, n.h * 0.30, n.w * 0.68, n.h * 0.08, 4); ctx.fill();
  // headlights face away (dim, up top), taillights face you (bright, bottom)
  ctx.fillStyle = 'rgba(255,246,207,.45)';
  rr(-n.w * 0.36, -n.h / 2 + 2, n.w * 0.18, 5, 3); ctx.fill();
  rr(n.w * 0.18, -n.h / 2 + 2, n.w * 0.18, 5, 3); ctx.fill();
  ctx.fillStyle = '#ff2d2d';
  rr(-n.w * 0.40, n.h / 2 - 8, n.w * 0.80, 6, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,45,45,.30)';
  rr(-n.w * 0.46, n.h / 2 - 12, n.w * 0.92, 13, 6); ctx.fill();
  ctx.restore();
}

/* ---------- roadside ---------- */
const ADS = [
  { t: 'DYINGTOLIVE.JP', s: 'STATIC BUILDS ONLY' },
  { t: '★ CHEAP PARTS ★', s: 'DYINGTOLIVE.JP/SHOP' },
  { t: 'HOUSE DECALS', s: 'MADE TO ORDER ★ $15' },
  { t: 'CART CHAOS', s: 'PLAY THE OTHER GAME →' }
];
function drawBoard(b) {
  const bx = b.side < 0 ? roadX - 66 : roadX + roadW + 66;
  const ad = ADS[b.ad];
  ctx.save();
  ctx.fillStyle = '#1a1a20';
  ctx.fillRect(bx - 4, b.y, 8, 90); // pole
  const bw = 190, bh = 74;
  ctx.fillStyle = '#0c0c10';
  ctx.fillRect(bx - bw / 2, b.y - bh, bw, bh);
  ctx.strokeStyle = '#7CFF6B'; ctx.lineWidth = 2;
  ctx.strokeRect(bx - bw / 2, b.y - bh, bw, bh);
  // glow
  ctx.fillStyle = 'rgba(124,255,107,.08)';
  ctx.fillRect(bx - bw / 2, b.y - bh, bw, bh);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = '900 17px Arial';
  ctx.fillText(ad.t, bx, b.y - bh + 32);
  ctx.fillStyle = '#7CFF6B'; ctx.font = 'bold 11px Arial';
  ctx.fillText(ad.s, bx, b.y - bh + 54);
  ctx.restore();
}

/* ---------- main draw ---------- */
function draw() {
  ctx.clearRect(0, 0, W, H);
  const shx = S.shake > 0.4 ? (Math.random() - .5) * S.shake : 0;
  const shy = S.shake > 0.4 ? (Math.random() - .5) * S.shake : 0;
  ctx.save();
  // camera feel: zoom out slightly with speed, skew with lateral movement
  const speedT = S.mode === 'play' ? Math.max(0, Math.min(1, (S.speed - S.baseSpeed) / (S.maxSpeed - S.baseSpeed))) : 0;
  const zoom = 1 - speedT * 0.045;
  const latV = (S.player.tx - S.player.x) * 0.0012;
  ctx.translate(W / 2, H * 0.72);
  ctx.scale(zoom, zoom);
  ctx.transform(1, 0, -latV, 1, 0, 0);
  ctx.translate(-W / 2 + shx, -H * 0.72 + shy);

  // night sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#07070d'); sky.addColorStop(1, '#0b0b12');
  ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, H + 40);
  // stars
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  for (let i = 0; i < 46; i++) {
    const sx = (i * 197.3 + S.dist * 0.4) % (W + 40);
    const sy = (i * 89.7) % (H * 0.5);
    ctx.fillRect(W - sx, sy, 2, 2);
  }
  // moon
  ctx.fillStyle = '#e8e8f0';
  ctx.beginPath(); ctx.arc(W * 0.86, H * 0.1, 34, 0, 7); ctx.fill();
  ctx.fillStyle = '#07070d';
  ctx.beginPath(); ctx.arc(W * 0.86 + 12, H * 0.1 - 6, 30, 0, 7); ctx.fill();

  // ground shoulders
  ctx.fillStyle = '#08080b';
  ctx.fillRect(-20, -20, roadX + 20, H + 40);
  ctx.fillRect(roadX + roadW, -20, W - roadX - roadW + 20, H + 40);

  // billboards + poles (behind road)
  for (const b of S.boards) drawBoard(b);
  ctx.fillStyle = '#232329';
  for (const pl of S.poles) {
    const px = pl.side < 0 ? roadX - 26 : roadX + roadW + 26;
    ctx.fillRect(px - 3, pl.y, 6, 44);
    ctx.fillStyle = '#fff6cf';
    ctx.beginPath(); ctx.arc(px, pl.y, 5, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,246,207,.10)';
    ctx.beginPath(); ctx.arc(px, pl.y + 26, 44, 0, 7); ctx.fill();
    ctx.fillStyle = '#232329';
  }

  // asphalt
  const asg = ctx.createLinearGradient(roadX, 0, roadX + roadW, 0);
  asg.addColorStop(0, '#101014'); asg.addColorStop(0.5, '#17171d'); asg.addColorStop(1, '#101014');
  ctx.fillStyle = asg;
  ctx.fillRect(roadX, -20, roadW, H + 40);
  // edge lines
  ctx.fillStyle = '#c9c9d4';
  ctx.fillRect(roadX + 6, -20, 4, H + 40);
  ctx.fillRect(roadX + roadW - 10, -20, 4, H + 40);
  // lane dashes (scroll)
  ctx.fillStyle = 'rgba(230,230,240,.55)';
  const dashH = 46, gap = 54, off = S.dist % (dashH + gap);
  for (let li = 1; li < 3; li++) {
    const lx = roadX + laneW * li;
    for (let y = -dashH - gap + off; y < H + dashH; y += dashH + gap)
      ctx.fillRect(lx - 3, y, 6, dashH);
  }
  // guardrails
  ctx.fillStyle = '#2c2c34';
  ctx.fillRect(roadX - 14, -20, 8, H + 40);
  ctx.fillRect(roadX + roadW + 6, -20, 8, H + 40);
  ctx.fillStyle = 'rgba(201,201,212,.5)';
  ctx.fillRect(roadX - 14, -20, 8, 5); ctx.fillRect(roadX + roadW + 6, -20, 8, 5);

  // speed lines
  if (S.mode === 'play' && S.speed > 15) {
    ctx.strokeStyle = 'rgba(255,255,255,' + Math.min(0.28, (S.speed - 15) * 0.035) + ')';
    ctx.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      const sx = Math.random() * W, sy = Math.random() * H, len = 40 + Math.random() * 90;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + len); ctx.stroke();
    }
  }

  // npcs (sorted far -> near)
  const sorted = S.npcs.slice().sort((a, b) => a.y - b.y);
  for (const n of sorted) {
    if (n.type === 'hellcat') drawHellcat(n);
    else if (n.type === 'truck') drawTruck(n);
    else drawSedan(n);
  }

  // player
  if (S.mode !== 'dead') drawS15(S.player.x, H * 0.86);

  // particles
  for (const pt of S.parts) {
    ctx.globalAlpha = Math.min(1, pt.life / 22);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.s / 2, pt.y - pt.s / 2, pt.s, pt.s);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // HUD
  if (S.mode === 'play' || S.mode === 'dead') {
    ctx.fillStyle = '#fff'; ctx.font = '900 26px Arial'; ctx.textAlign = 'left';
    ctx.fillText(Math.floor(S.score).toLocaleString(), 18, 40);
    ctx.fillStyle = '#7CFF6B'; ctx.font = '900 15px Arial';
    ctx.fillText('NEAR MISS x' + S.nearMiss, 18, 64);
    ctx.fillStyle = '#555'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'right';
    ctx.fillText('BEST ' + S.best.toLocaleString(), W - 18, 36);
    // speedo
    const sp = (S.speed - S.baseSpeed) / (S.maxSpeed - S.baseSpeed);
    ctx.textAlign = 'right'; ctx.fillStyle = '#888'; ctx.font = 'bold 12px Arial';
    ctx.fillText(Math.min(400, Math.round(S.speed / S.maxSpeed * 400)) + ' MPH', W - 18, 58);
    ctx.fillStyle = '#222'; ctx.fillRect(W - 158, 66, 140, 7);
    const grd = ctx.createLinearGradient(W - 158, 0, W - 18, 0);
    grd.addColorStop(0, '#7CFF6B'); grd.addColorStop(1, '#ff5b5b');
    ctx.fillStyle = grd; ctx.fillRect(W - 158, 66, 140 * sp, 7);
  }
}

/* ---------- loop ---------- */
let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(3, (ts - lastTs) / 16.67 || 1);
  lastTs = ts;
  if (S.mode === 'play') update(dt);
  else { // idle scroll behind menus
    S.dist += 3 * dt;
    for (const pl of S.poles) { pl.y += 3 * dt; if (pl.y > H + 60) { pl.y -= H + 260; pl.side *= -1; } }
  }
  draw();
}

/* ---------- ui ---------- */
function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
  reset();
  S.mode = 'play';
}
document.getElementById('startBtn').onclick = startGame;
document.getElementById('retryBtn').onclick = startGame;
document.addEventListener('visibilitychange', () => { if (document.hidden) for (const k in keys) keys[k] = false; });

resize();
requestAnimationFrame(frame);
</script>
</body>
