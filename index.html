<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WHEEL MERGE ★ DYINGTOLIVE</title>
<meta name="description" content="Drop wheels, merge matching pairs, build the show chrome wheel. A DYINGTOLIVE joint.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#040405;
    font-family:'Arial Black',Arial,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #wrap { display:flex; flex-direction:column; align-items:center; height:100vh; height:100dvh; padding:10px 10px 8px; }
  h1.title { font-size:clamp(26px,6.5vw,44px); letter-spacing:3px; line-height:1; text-align:center;
    background:linear-gradient(180deg,#fff 0%,#c9c9d4 40%,#6a6a75 60%,#e8e8f0 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 18px rgba(200,200,220,.25)); }
  .sub { color:#888; letter-spacing:4px; font-size:11px; margin:4px 0 8px; font-family:Arial,sans-serif; font-weight:bold; }
  #hud { display:flex; gap:10px; align-items:stretch; width:min(480px,100%); margin-bottom:8px; }
  .panel { flex:1; border:1px solid #2a2a32; background:#0b0b0f; padding:6px 10px; text-align:center; }
  .panel .lbl { color:#888; font-size:9px; letter-spacing:3px; font-family:Arial,sans-serif; font-weight:bold; }
  .panel .val { color:#fff; font-size:20px; letter-spacing:1px; }
  .panel .val.gold { color:#ffd94d; }
  #nextbox { display:flex; align-items:center; justify-content:center; gap:8px; }
  #nextbox canvas { display:block; }
  #stage { position:relative; width:min(480px,100%); flex:1; min-height:0; }
  #game { display:block; width:100%; height:100%; background:#0a0a0e;
    border:1px solid #2a2a32; border-radius:6px; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(0,0,0,.86); z-index:10; text-align:center; padding:18px; border-radius:6px; }
  .hidden { display:none !important; }
  .big { font-size:clamp(30px,7vw,54px); letter-spacing:3px; line-height:1;
    background:linear-gradient(180deg,#fff 0%,#c9c9d4 40%,#6a6a75 60%,#e8e8f0 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:10px; }
  .tagline { color:#888; letter-spacing:2px; font-size:11px; margin-bottom:16px; font-family:Arial,sans-serif; font-weight:bold; line-height:1.8; }
  .tagline b { color:#bbb; }
  .bigbtn { background:linear-gradient(180deg,#f2f2f6,#c9c9d4 55%,#a9a9b4); color:#000; border:none; cursor:pointer;
    font-family:'Arial Black',Arial,sans-serif; letter-spacing:3px; font-size:18px; padding:15px 48px; text-transform:uppercase;
    box-shadow:0 6px 30px rgba(200,200,220,.3); transition:transform .12s ease; margin-bottom:12px; }
  .bigbtn:active { transform:scale(.96); }
  .ghostbtn { background:transparent; color:#999; border:1px solid #3a3a44; cursor:pointer;
    font-family:'Arial Black',Arial,sans-serif; letter-spacing:2px; font-size:12px; padding:10px 26px; }
  .ghostbtn:active { transform:scale(.96); }
  #foot { width:min(480px,100%); display:flex; justify-content:space-between; align-items:center; padding-top:8px; }
  #foot a { color:#888; font-size:10px; letter-spacing:2px; text-decoration:none; font-family:Arial,sans-serif; font-weight:bold; }
  #foot a:hover { color:#fff; }
  #foot button { background:transparent; color:#888; border:1px solid #3a3a44; cursor:pointer;
    font-family:'Arial Black',Arial,sans-serif; letter-spacing:2px; font-size:10px; padding:7px 14px; }
  #foot button:active { transform:scale(.96); }
</style>
</head>
<body>
<div id="wrap">
  <h1 class="title">WHEEL MERGE</h1>
  <div class="sub">★ DYINGTOLIVE ★</div>
  <div id="hud">
    <div class="panel"><div class="lbl">SCORE</div><div class="val gold" id="score">0</div></div>
    <div class="panel"><div class="lbl">BEST</div><div class="val" id="best">0</div></div>
    <div class="panel"><div class="lbl">NEXT</div><div id="nextbox"><canvas id="nextcv" width="44" height="44"></canvas></div></div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="startov">
      <div class="big">WHEEL<br>MERGE</div>
      <div class="tagline">DROP WHEELS — MERGE MATCHING PAIRS<br>CHAIN THEM ALL THE WAY TO THE <b>SHOW CHROME WHEEL</b><br><br>MOVE TO AIM — TAP / CLICK TO DROP<br>DON'T LET THE STACK CROSS THE LINE</div>
      <button class="bigbtn" id="startbtn">PLAY</button>
    </div>
    <div class="overlay hidden" id="overov">
      <div class="big">GAME<br>OVER</div>
      <div class="tagline">SCORE <b id="finalscore" style="color:#ffd94d">0</b><br>BEST <b id="finalbest" style="color:#fff">0</b></div>
      <button class="bigbtn" id="againbtn">PLAY AGAIN</button>
    </div>
  </div>
  <div id="foot">
    <a href="https://dyingtolive-jp.github.io/dyingtolive-jp/">★ DYINGTOLIVE ★</a>
    <button id="restartbtn">RESTART</button>
  </div>
</div>
<script>
"use strict";
/* WHEEL MERGE — drop, merge, build the show chrome wheel. */
const WHEELS = [
  { name:'Steelie',     r:16, light:'#5a5a64', dark:'#222228', spokes:0,  holes:true,  lip:false, bolts:false, score:1  },
  { name:'Hubcap',      r:24, light:'#b9b9c2', dark:'#6f6f78', spokes:0,  holes:false, lip:false, bolts:false, score:3  },
  { name:'Stock Alloy', r:34, light:'#a8a8b2', dark:'#5d5d66', spokes:5,  holes:false, lip:false, bolts:false, score:6  },
  { name:'5-Spoke',     r:46, light:'#c2c2cc', dark:'#67676f', spokes:5,  holes:false, lip:false, bolts:false, score:10 },
  { name:'Mesh',        r:58, light:'#cfcfd8', dark:'#70707a', spokes:14, holes:false, lip:false, bolts:false, score:15 },
  { name:'Split 5',     r:72, light:'#d6d6de', dark:'#787882', spokes:10, holes:false, lip:false, bolts:false, score:21 },
  { name:'Multi-Spoke', r:88, light:'#dddddd', dark:'#7d7d87', spokes:12, holes:false, lip:false, bolts:false, score:28 },
  { name:'Deep Dish',   r:106,light:'#e2e2e8', dark:'#82828c', spokes:6,  holes:false, lip:true,  bolts:false, score:36 },
  { name:'3-Piece',     r:126,light:'#ececf0', dark:'#8a8a94', spokes:8,  holes:false, lip:true,  bolts:true,  score:45 },
  { name:'Billet',      r:150,light:'#f4f4f8', dark:'#90909a', spokes:10, holes:false, lip:true,  bolts:true,  score:55 },
  { name:'Show Chrome', r:180,light:'#ffffff', dark:'#9a9aa4', spokes:12, holes:false, lip:true,  bolts:true,  score:66 },
];
const MAX_SPAWN_TIER = 4; // only the 5 smallest drop from the top
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const nextcv = document.getElementById('nextcv');
const nctx = nextcv.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const startov = document.getElementById('startov');
const overov = document.getElementById('overov');

let W = 0, H = 0, DPR = 1, SCALE = 1; // logical box size + wheel scale
let fruits = [];      // {x,y,vx,vy,tier,dead} — wheels, kept the old name internally
let popups = [];      // {x,y,text,life}
let current = null;   // wheel held at the top, not yet dropped
let nextTier = 0;
let score = 0;
let best = +(localStorage.getItem('dtl-wheel-best') || 0);
let running = false, over = false;
let dropX = 0, dropCooldown = 0;
let overTimer = 0;
let last = 0, acc = 0;
const STEP = 1000 / 120;

bestEl.textContent = best;

/* --- aired-up tire bounce sound (synthesized, no files) --- */
let AC = null, noiseBuf = null, lastBounce = 0;
function ensureAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (!noiseBuf) {
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.1, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
  } catch (e) { /* audio unavailable — game still plays silent */ }
}
function bounceSound(strength) { // strength 0..1, from impact speed
  if (!AC || AC.state !== 'running') return;
  const now = performance.now();
  if (now - lastBounce < 70) return; // throttle so a pile-up doesn't machine-gun
  lastBounce = now;
  const t = AC.currentTime;
  const s = Math.min(1, Math.max(0, strength));
  const vol = 0.12 + 0.35 * s;
  // body: sine "boing" — pitch drops as the tire squashes and rebounds
  const osc = AC.createOscillator();
  const gain = AC.createGain();
  osc.type = 'sine';
  const f0 = 130 + 90 * s;
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(50, t + 0.15);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
  osc.connect(gain).connect(AC.destination);
  osc.start(t); osc.stop(t + 0.18);
  // second harmonic wobble for the rubbery boing character
  const osc2 = AC.createOscillator();
  const gain2 = AC.createGain();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(f0 * 2, t);
  osc2.frequency.exponentialRampToValueAtTime(110, t + 0.10);
  gain2.gain.setValueAtTime(vol * 0.25, t);
  gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
  osc2.connect(gain2).connect(AC.destination);
  osc2.start(t); osc2.stop(t + 0.12);
  // rubber thud: short lowpassed noise burst
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const filt = AC.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 480;
  const ng = AC.createGain();
  ng.gain.setValueAtTime(vol * 0.7, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  src.connect(filt).connect(ng).connect(AC.destination);
  src.start(t); src.stop(t + 0.09);
}

function resize() {
  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(200, rect.width);
  H = Math.max(300, rect.height);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // wheel radii are tuned for a ~420px wide box; scale to fit
  SCALE = Math.min(1, W / 420);
  if (current) current.x = clamp(dropX, rad(current.tier), W - rad(current.tier));
  drawNext();
}
function rad(tier) { return WHEELS[tier].r * SCALE; }
function lineY() { return H * 0.18; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function randTier() { return Math.floor(Math.random() * (MAX_SPAWN_TIER + 1)); }

function newGame() {
  ensureAudio();
  fruits = []; popups = [];
  score = 0; scoreEl.textContent = '0';
  nextTier = randTier();
  over = false; overTimer = 0; dropCooldown = 0;
  spawnHeld();
  running = true;
  overov.classList.add('hidden');
  startov.classList.add('hidden');
}
function spawnHeld() {
  current = { x: W / 2, y: lineY() - rad(nextTier) - 8, vx: 0, vy: 0, tier: nextTier, dead: false, held: true };
  dropX = W / 2;
  nextTier = randTier();
  drawNext();
}
function drawWheelShape(c, x, y, tier, r) {
  const w = WHEELS[tier];
  // tire
  c.fillStyle = '#131316';
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  // tread ticks
  c.strokeStyle = 'rgba(255,255,255,0.07)';
  c.lineWidth = Math.max(1, r * 0.03);
  for (let i = 0; i < 28; i++) {
    const a = i / 28 * Math.PI * 2;
    c.beginPath();
    c.moveTo(x + Math.cos(a) * r * 0.92, y + Math.sin(a) * r * 0.92);
    c.lineTo(x + Math.cos(a) * r * 0.99, y + Math.sin(a) * r * 0.99);
    c.stroke();
  }
  // rim face
  const rr = r * 0.76;
  const g = c.createRadialGradient(x - rr * 0.35, y - rr * 0.4, rr * 0.1, x, y, rr);
  g.addColorStop(0, w.light);
  g.addColorStop(0.7, w.light);
  g.addColorStop(1, w.dark);
  c.fillStyle = g;
  c.beginPath(); c.arc(x, y, rr, 0, Math.PI * 2); c.fill();
  // polished lip on the nicer wheels
  if (w.lip) {
    c.strokeStyle = 'rgba(255,255,255,0.85)';
    c.lineWidth = Math.max(1.5, rr * 0.05);
    c.beginPath(); c.arc(x, y, rr * 0.96, 0, Math.PI * 2); c.stroke();
  }
  // rim edge
  c.strokeStyle = 'rgba(0,0,0,0.4)';
  c.lineWidth = Math.max(1, rr * 0.03);
  c.beginPath(); c.arc(x, y, rr, 0, Math.PI * 2); c.stroke();
  // spokes
  if (w.spokes) {
    c.strokeStyle = w.dark;
    c.lineWidth = Math.max(1.5, rr * 0.11);
    c.lineCap = 'round';
    const hubR = rr * 0.24;
    for (let i = 0; i < w.spokes; i++) {
      const a = i / w.spokes * Math.PI * 2;
      c.beginPath();
      c.moveTo(x + Math.cos(a) * hubR, y + Math.sin(a) * hubR);
      c.lineTo(x + Math.cos(a) * rr * 0.92, y + Math.sin(a) * rr * 0.92);
      c.stroke();
    }
  }
  // steelie ventilation holes
  if (w.holes) {
    c.fillStyle = '#0c0c0e';
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2 - Math.PI / 2;
      c.beginPath(); c.arc(x + Math.cos(a) * rr * 0.52, y + Math.sin(a) * rr * 0.52, rr * 0.14, 0, Math.PI * 2); c.fill();
    }
  }
  // 3-piece hardware bolts around the rim
  if (w.bolts) {
    c.fillStyle = '#f2f2f6';
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2;
      c.beginPath(); c.arc(x + Math.cos(a) * rr * 0.86, y + Math.sin(a) * rr * 0.86, Math.max(1, rr * 0.035), 0, Math.PI * 2); c.fill();
    }
  }
  // hub + lug nuts + center cap
  c.fillStyle = w.dark;
  c.beginPath(); c.arc(x, y, rr * 0.26, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(0,0,0,0.55)';
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2;
    c.beginPath(); c.arc(x + Math.cos(a) * rr * 0.17, y + Math.sin(a) * rr * 0.17, Math.max(1, rr * 0.03), 0, Math.PI * 2); c.fill();
  }
  c.fillStyle = w.light;
  c.beginPath(); c.arc(x, y, rr * 0.10, 0, Math.PI * 2); c.fill();
  // gloss
  c.fillStyle = 'rgba(255,255,255,0.18)';
  c.beginPath(); c.ellipse(x - rr * 0.35, y - rr * 0.42, rr * 0.22, rr * 0.12, -0.6, 0, Math.PI * 2); c.fill();
}
function drawNext() {
  const s = 44;
  nctx.clearRect(0, 0, s, s);
  const r = Math.min(rad(nextTier), 20);
  drawWheelShape(nctx, s / 2, s / 2, nextTier, r);
}
function drop() {
  if (!running || over || !current || dropCooldown > 0) return;
  const f = current;
  f.held = false;
  f.y = Math.min(f.y, lineY() - rad(f.tier) - 2);
  fruits.push(f);
  current = null;
  dropCooldown = 450;
}
function step(dt) {
  // dt in ms; fixed 120Hz steps
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 8) { physics(STEP / 1000); acc -= STEP; n++; }
  if (n === 8) acc = 0;
  if (dropCooldown > 0) dropCooldown -= dt;
  if (!current && running && !over && dropCooldown <= 0) spawnHeld();
  // popups
  for (const p of popups) { p.y -= dt * 0.03; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
  // GAME OVER: any wheel whose top sits above the line, continuously, for 1 second.
  // Position-based on purpose — stacked wheels jiggle forever, so a speed test never fired.
  if (running && !over) {
    let danger = false;
    for (const f of fruits) {
      if (f.dead) continue;
      if (f.y - rad(f.tier) < lineY()) { danger = true; break; }
    }
    overTimer = danger ? overTimer + dt : 0;
    if (overTimer > 1000) endGame();
  }
}
function physics(dt) {
  const g = 1500; // px/s^2
  for (const f of fruits) {
    if (f.dead) continue;
    f.vy += g * dt;
    f.vx *= 0.999; f.vy *= 0.999;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    const r = rad(f.tier);
    if (f.x < r) { if (Math.abs(f.vx) > 200) bounceSound(Math.abs(f.vx) / 900); f.x = r; f.vx = Math.abs(f.vx) * 0.2; }
    if (f.x > W - r) { if (Math.abs(f.vx) > 200) bounceSound(Math.abs(f.vx) / 900); f.x = W - r; f.vx = -Math.abs(f.vx) * 0.2; }
    if (f.y > H - r) { if (Math.abs(f.vy) > 150) bounceSound(Math.abs(f.vy) / 900); f.y = H - r; f.vy = -Math.abs(f.vy) * 0.15; f.vx *= 0.8; }
  }
  // pairwise collisions + merges (repeat until stable, capped)
  for (let iter = 0; iter < 4; iter++) {
    let merged = false;
    for (let i = 0; i < fruits.length; i++) {
      const a = fruits[i];
      if (a.dead) continue;
      for (let j = i + 1; j < fruits.length; j++) {
        const b = fruits[j];
        if (b.dead) continue;
        const ra = rad(a.tier), rb = rad(b.tier);
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy), min = ra + rb;
        if (d >= min || d === 0) continue;
        if (a.tier === b.tier) {
          a.dead = true; b.dead = true;
          if (a.tier < WHEELS.length - 1) {
            const nt = a.tier + 1;
            fruits.push({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
              vx: (a.vx + b.vx) / 2, vy: Math.min(a.vy, b.vy) - 60,
              tier: nt, dead: false });
          }
          const pts = WHEELS[a.tier].score;
          score += pts;
          scoreEl.textContent = score;
          popups.push({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, text: '+' + pts, life: 900 });
          merged = true;
        } else {
          // positional correction + simple velocity exchange
          const nx = dx / d, ny = dy / d;
          const overlap = (min - d) / 2;
          const total = ra + rb;
          a.x -= nx * overlap * (rb / total) * 2; a.y -= ny * overlap * (rb / total) * 2;
          b.x += nx * overlap * (ra / total) * 2; b.y += ny * overlap * (ra / total) * 2;
          const rvn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rvn < 0) {
            if (-rvn > 180) bounceSound(-rvn / 900);
            const imp = -rvn * 0.6;
            a.vx -= nx * imp; a.vy -= ny * imp;
            b.vx += nx * imp; b.vy += ny * imp;
          }
        }
      }
    }
    fruits = fruits.filter(f => !f.dead);
    if (!merged) break;
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  // box floor shading
  ctx.fillStyle = '#0d0d12';
  ctx.fillRect(0, 0, W, H);
  // danger line
  ctx.strokeStyle = 'rgba(255,80,80,.55)';
  ctx.setLineDash([8, 8]);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(6, lineY()); ctx.lineTo(W - 6, lineY()); ctx.stroke();
  ctx.setLineDash([]);
  // held wheel + guide
  if (current && running && !over) {
    const r = rad(current.tier);
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.setLineDash([4, 6]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(current.x, current.y + r); ctx.lineTo(current.x, H); ctx.stroke();
    ctx.setLineDash([]);
    drawWheelShape(ctx, current.x, current.y, current.tier, r);
  }
  for (const f of fruits) {
    if (f.dead) continue;
    drawWheelShape(ctx, f.x, f.y, f.tier, rad(f.tier));
  }
  // popups
  ctx.textAlign = 'center';
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, p.life / 900);
    ctx.font = 'bold ' + Math.round(16 * SCALE + 6) + 'px Arial';
    ctx.fillStyle = '#ffd94d';
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }
  // danger vignette when the stack is over the line
  if (overTimer > 0 && running && !over) {
    ctx.fillStyle = 'rgba(255,40,40,' + Math.min(0.12, overTimer / 1000 * 0.12) + ')';
    ctx.fillRect(0, 0, W, lineY());
  }
}
function loop(t) {
  requestAnimationFrame(loop);
  if (!last) last = t;
  const dt = Math.min(100, t - last);
  last = t;
  if (running && !over) step(dt);
  draw();
}
function endGame() {
  over = true; running = false;
  if (score > best) { best = score; localStorage.setItem('dtl-wheel-best', String(best)); bestEl.textContent = best; }
  document.getElementById('finalscore').textContent = score;
  document.getElementById('finalbest').textContent = best;
  overov.classList.remove('hidden');
}
function aim(clientX) {
  if (!current) return;
  const rect = canvas.getBoundingClientRect();
  dropX = clamp(clientX - rect.left, rad(current.tier), W - rad(current.tier));
  current.x = dropX;
}
canvas.addEventListener('pointermove', e => { if (running && !over) aim(e.clientX); });
canvas.addEventListener('pointerdown', e => {
  if (!running || over) return;
  ensureAudio();
  aim(e.clientX);
  drop();
});
document.getElementById('startbtn').addEventListener('click', newGame);
document.getElementById('againbtn').addEventListener('click', newGame);
document.getElementById('restartbtn').addEventListener('click', () => { if (running || over) newGame(); });
window.addEventListener('resize', resize);
resize();
drawNext();
requestAnimationFrame(loop);
</script>
</body>
</html>
