<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CART CHAOS ★ DYINGTOLIVE</title>
<meta name="description" content="Ride a shopping cart down the hill. Flip it. Don't die. A DYINGTOLIVE joint.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: 'Arial Black', Arial, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,.82); z-index: 10; text-align: center; padding: 20px;
  }
  .hidden { display: none !important; }
  h1.title {
    font-size: clamp(42px, 9vw, 96px); letter-spacing: 4px; line-height: .95;
    background: linear-gradient(180deg, #fff 0%, #c9c9d4 40%, #6a6a75 60%, #e8e8f0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 18px rgba(200,200,220,.25));
    margin-bottom: 6px;
  }
  .subtitle { color: #7CFF6B; letter-spacing: 6px; font-size: clamp(11px, 2.4vw, 16px); margin-bottom: 26px; }
  .controls-hint { color: #999; font-size: 13px; letter-spacing: 2px; line-height: 2; margin-bottom: 28px; font-family: Arial, sans-serif; font-weight: bold; }
  .controls-hint b { color: #fff; }
  .bigbtn {
    background: linear-gradient(180deg, #f2f2f6, #c9c9d4 55%, #a9a9b4);
    color: #000; border: none; cursor: pointer; font-family: 'Arial Black', Arial, sans-serif;
    letter-spacing: 3px; font-size: 20px; padding: 16px 54px; text-transform: uppercase;
    box-shadow: 0 6px 30px rgba(200,200,220,.3); transition: transform .12s ease;
  }
  .bigbtn:active { transform: scale(.96); }
  #finalScore { font-size: clamp(30px, 6vw, 54px); color: #fff; letter-spacing: 3px; margin: 8px 0 2px; }
  #finalBest { color: #7CFF6B; letter-spacing: 3px; font-size: 15px; margin-bottom: 24px; }
  #crashMsg { color: #ff5b5b; letter-spacing: 4px; font-size: clamp(16px, 3.4vw, 24px); margin-bottom: 4px; }
  .brand { position: fixed; bottom: 12px; width: 100%; text-align: center; color: #444; font-size: 11px; letter-spacing: 4px; z-index: 5; pointer-events: none; }
  #trickPop {
    position: fixed; top: 22%; width: 100%; text-align: center; z-index: 6; pointer-events: none;
    font-size: clamp(26px, 5.5vw, 52px); letter-spacing: 4px; color: #7CFF6B;
    text-shadow: 0 0 24px rgba(124,255,107,.6); opacity: 0; transition: opacity .25s ease;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="trickPop"></div>

<div class="overlay" id="startScreen">
  <h1 class="title">CART<br>CHAOS</h1>
  <div class="subtitle">★ DYINGTOLIVE ★</div>
  <div class="controls-hint">
    <b>← →</b> / <b>A D</b> — LEAN &nbsp;•&nbsp; <b>SPACE</b> — HOP<br>
    TAP LEFT / RIGHT SIDE ON PHONE<br>
    FLIP IN THE AIR FOR POINTS. DON'T LAND ON YOUR HEAD.
  </div>
  <button class="bigbtn" id="startBtn">SEND IT</button>
</div>

<div class="overlay hidden" id="overScreen">
  <div id="crashMsg">WRECKED</div>
  <h1 class="title" style="font-size:clamp(30px,6vw,60px)">GAME OVER</h1>
  <div id="finalScore">0</div>
  <div id="finalBest">BEST: 0</div>
  <button class="bigbtn" id="retryBtn">RUN IT BACK</button>
</div>

<div class="brand">DYINGTOLIVE.JP ★ STATIC BUILDS ONLY</div>

<script>
'use strict';
/* ================= CART CHAOS ================= */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- terrain ---------- */
function groundY(x) {
  const t = x * 0.0016;
  const amp = 60 + Math.min(x * 0.012, 190); // hills get bigger
  return H * 0.62
    + Math.sin(t * 2.1) * amp * 0.55
    + Math.sin(t * 5.3 + 1.7) * amp * 0.28
    + Math.sin(t * 11.7 + 4.2) * amp * 0.12
    - x * 0.055; // overall downhill
}
function groundSlope(x) {
  const e = 6;
  return Math.atan2(groundY(x + e) - groundY(x - e), 2 * e);
}

/* ---------- state ---------- */
const S = {
  mode: 'menu', // menu | play | dead
  x: 0, y: 0, vx: 0, vy: 0, angle: 0, angV: 0,
  grounded: true, airRot: 0,
  speed: 0, score: 0, coins: 0,
  camX: 0, shake: 0, t: 0,
  coinsArr: [], rocksArr: [], parts: [],
  best: parseInt(localStorage.getItem('cartchaos_best') || '0', 10),
  crashReason: ''
};
const GRAV = 0.55;

function spawnAhead() {
  // keep coins/rocks populated ahead of camera
  const aheadX = S.camX + W + 400;
  let lastX = S.coinsArr.length ? S.coinsArr[S.coinsArr.length - 1].x : S.x;
  if (S.rocksArr.length) lastX = Math.max(lastX, S.rocksArr[S.rocksArr.length - 1].x);
  while (lastX < aheadX) {
    lastX += 260 + Math.random() * 420;
    const r = Math.random();
    if (r < 0.62) {
      // coin arc (3-5 coins)
      const n = 3 + (Math.random() * 3 | 0);
      const bx = lastX, lift = 90 + Math.random() * 130;
      for (let i = 0; i < n; i++) {
        const cx = bx + i * 46;
        S.coinsArr.push({ x: cx, y: groundY(cx) - lift - Math.sin(i / (n - 1) * Math.PI) * 60, got: false, ph: Math.random() * 6 });
      }
    } else if (r < 0.85 && S.x > 900) {
      S.rocksArr.push({ x: lastX, s: 22 + Math.random() * 26 });
    }
  }
  // prune behind
  const cut = S.camX - 300;
  S.coinsArr = S.coinsArr.filter(c => c.x > cut && !c.got);
  S.rocksArr = S.rocksArr.filter(r => r.x > cut);
}

function reset() {
  S.x = 0; S.vx = 4.2; S.vy = 0;
  S.y = groundY(0) - 26; S.angle = groundSlope(0); S.angV = 0;
  S.grounded = true; S.airRot = 0;
  S.score = 0; S.coins = 0; S.camX = -W * 0.3; S.shake = 0; S.t = 0;
  S.coinsArr = []; S.rocksArr = []; S.parts = [];
  S.crashReason = '';
  spawnAhead();
}

/* ---------- input ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' && S.mode === 'play' && S.grounded) {
    S.vy = -9.5; S.grounded = false; S.airRot = 0;
    burst(S.x, S.y + 20, 8, '#c9c9d4');
  }
  if ((e.key === 'Enter') && S.mode !== 'play') startGame();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
// touch: left/right half = lean
let touchSide = 0;
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  touchSide = t.clientX < W / 2 ? -1 : 1;
  if (S.mode === 'play' && S.grounded && e.touches.length > 1) { S.vy = -9.5; S.grounded = false; S.airRot = 0; }
}, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); touchSide = 0; }, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  touchSide = t.clientX < W / 2 ? -1 : 1;
}, { passive: false });

function leanInput() {
  let l = 0;
  if (keys['arrowleft'] || keys['a']) l -= 1;
  if (keys['arrowright'] || keys['d']) l += 1;
  return l + touchSide;
}

/* ---------- particles ---------- */
function burst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    S.parts.push({ x, y, vx: (Math.random() - .5) * 7, vy: -Math.random() * 6 - 1, life: 30 + Math.random() * 20, color });
  }
}
const trickPopEl = document.getElementById('trickPop');
let trickTimer = null;
function trickPop(txt) {
  trickPopEl.textContent = txt;
  trickPopEl.style.opacity = 1;
  clearTimeout(trickTimer);
  trickTimer = setTimeout(() => trickPopEl.style.opacity = 0, 900);
}

/* ---------- update ---------- */
function update() {
  S.t++;
  const lean = Math.max(-1, Math.min(1, leanInput()));

  if (S.grounded) {
    // follow terrain
    const slope = groundSlope(S.x);
    S.angle += (slope - S.angle) * 0.35;
    S.y = groundY(S.x) - 26;
    // speed: gravity along slope + base push, capped
    const target = 5.2 + Math.min(S.x * 0.00045, 7.5);
    S.vx += ((target - S.vx) * 0.02) + (-Math.sin(slope) * 0.16);
    S.vx = Math.max(3.2, Math.min(S.vx, 15));
    S.x += S.vx;
    S.vy = 0;
    // lean shifts weight: forward lean = faster downhill
    S.vx += lean * 0.045;
    // check for launch: if ground falls away fast, go airborne
    const aheadY = groundY(S.x + S.vx * 6) - 26;
    if (aheadY > S.y + 26) {
      S.grounded = false;
      S.vy = (aheadY - S.y) * 0.12 - 2.2;
      S.airRot = 0;
    }
    // rock collision
    for (const r of S.rocksArr) {
      const dx = Math.abs(r.x - S.x);
      if (dx < r.s * 0.8) {
        const ry = groundY(r.x) - r.s * 0.5;
        if (Math.abs(S.y - ry) < 44) { die('ROCKED'); return; }
      }
    }
    // rolling dust
    if (S.t % 6 === 0 && S.vx > 6) burst(S.x - 24, S.y + 22, 1, 'rgba(150,150,160,.5)');
  } else {
    // airborne
    S.vy += GRAV;
    S.x += S.vx;
    S.y += S.vy;
    S.angV = lean * 0.16;
    S.angle += S.angV;
    S.airRot += S.angV;
    // full rotations = trick points
    if (Math.abs(S.airRot) > Math.PI * 2) {
      S.airRot -= Math.sign(S.airRot) * Math.PI * 2;
      const pts = 150;
      S.score += pts;
      trickPop(S.airRot < 0 ? 'BACKFLIP +150' : 'FRONTFLIP +150');
      burst(S.x, S.y, 14, '#7CFF6B');
    }
    // landing check
    const gy = groundY(S.x) - 26;
    if (S.y >= gy && S.vy > 0) {
      const slope = groundSlope(S.x);
      let diff = Math.abs(normAngle(S.angle - slope));
      S.y = gy;
      if (diff < 0.85) {
        // clean landing
        S.grounded = true;
        const bonus = S.vy > 8 ? 40 : 10;
        S.score += bonus;
        if (S.vy > 10) { trickPop('BIG AIR +' + bonus); burst(S.x, S.y + 20, 12, '#c9c9d4'); }
        S.vx *= 0.94;
        S.vy = 0;
        S.angle = slope;
      } else {
        die(diff > 1.9 ? 'LANDED ON YOUR HEAD' : 'BAILED');
        return;
      }
    }
    if (S.y > H + 600) { die('LOST TO THE VOID'); return; }
  }

  // coins
  for (const c of S.coinsArr) {
    if (c.got) continue;
    const dx = c.x - S.x, dy = (c.y + Math.sin(S.t * 0.08 + c.ph) * 6) - S.y;
    if (dx * dx + dy * dy < 42 * 42) {
      c.got = true; S.coins++; S.score += 25;
      burst(c.x, c.y, 8, '#ffd94d');
    }
  }

  // camera
  const targetCam = S.x - W * 0.32;
  S.camX += (targetCam - S.camX) * 0.12;
  if (S.shake > 0) S.shake *= 0.88;

  // score = distance
  S.score += S.vx * 0.06;

  // particles
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const p = S.parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life--;
    if (p.life <= 0) S.parts.splice(i, 1);
  }

  spawnAhead();
}
function normAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}
function die(reason) {
  S.mode = 'dead';
  S.crashReason = reason;
  S.shake = 14;
  burst(S.x, S.y, 30, '#ff5b5b');
  burst(S.x, S.y, 20, '#c9c9d4');
  const sc = Math.floor(S.score);
  if (sc > S.best) { S.best = sc; localStorage.setItem('cartchaos_best', String(sc)); }
  document.getElementById('crashMsg').textContent = reason;
  document.getElementById('finalScore').textContent = sc.toLocaleString();
  document.getElementById('finalBest').textContent = 'BEST: ' + S.best.toLocaleString() + ' ★ COINS: ' + S.coins;
  setTimeout(() => document.getElementById('overScreen').classList.remove('hidden'), 650);
}

/* ---------- draw ---------- */
function draw() {
  ctx.clearRect(0, 0, W, H);
  const shx = S.shake > 0.5 ? (Math.random() - .5) * S.shake : 0;
  const shy = S.shake > 0.5 ? (Math.random() - .5) * S.shake : 0;

  // sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0a0a12'); sky.addColorStop(0.55, '#0d0d16'); sky.addColorStop(1, '#050505');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // moon
  ctx.save();
  ctx.fillStyle = '#e8e8f0';
  ctx.beginPath(); ctx.arc(W * 0.8 - S.camX * 0.02, H * 0.16, 44, 0, 7); ctx.fill();
  ctx.fillStyle = '#0a0a12';
  ctx.beginPath(); ctx.arc(W * 0.8 - S.camX * 0.02 + 16, H * 0.16 - 8, 40, 0, 7); ctx.fill();
  ctx.restore();

  // parallax hills (background layers)
  for (let L = 0; L < 2; L++) {
    const par = L === 0 ? 0.25 : 0.5;
    ctx.fillStyle = L === 0 ? '#0b0b13' : '#0e0e17';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let sx = 0; sx <= W + 20; sx += 20) {
      const wx = sx + S.camX * par;
      const y = H * (0.5 - L * 0.12) + Math.sin(wx * 0.0011 + L * 3) * 90 - wx * 0.03 + shy;
      ctx.lineTo(sx, y);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }

  // stars
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (let i = 0; i < 40; i++) {
    const sx = ((i * 197.3) % (W + 200)) - 100 - (S.camX * 0.1 % (W + 200));
    const sy = (i * 89.7) % (H * 0.45);
    ctx.fillRect(((sx % (W + 200)) + W + 200) % (W + 200) - 100, sy, 2, 2);
  }

  ctx.save();
  ctx.translate(-S.camX + shx, shy);

  // ground
  const gx0 = S.camX - 60, gx1 = S.camX + W + 60;
  ctx.beginPath();
  ctx.moveTo(gx0, H + 400);
  for (let x = gx0; x <= gx1; x += 14) ctx.lineTo(x, groundY(x));
  ctx.lineTo(gx1, H + 400); ctx.closePath();
  const gg = ctx.createLinearGradient(0, H * 0.4, 0, H);
  gg.addColorStop(0, '#17171f'); gg.addColorStop(1, '#08080c');
  ctx.fillStyle = gg; ctx.fill();
  // chrome edge line
  ctx.beginPath();
  for (let x = gx0; x <= gx1; x += 14) { const y = groundY(x); x === gx0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.strokeStyle = '#c9c9d4'; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = 'rgba(201,201,212,.25)'; ctx.lineWidth = 9; ctx.stroke();

  // rocks
  for (const r of S.rocksArr) {
    const ry = groundY(r.x);
    ctx.fillStyle = '#23232c';
    ctx.beginPath();
    ctx.moveTo(r.x - r.s, ry);
    ctx.lineTo(r.x - r.s * 0.5, ry - r.s * 1.1);
    ctx.lineTo(r.x + r.s * 0.4, ry - r.s * 0.9);
    ctx.lineTo(r.x + r.s, ry);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#4a4a55'; ctx.lineWidth = 2; ctx.stroke();
  }

  // coins
  for (const c of S.coinsArr) {
    if (c.got) continue;
    const cy = c.y + Math.sin(S.t * 0.08 + c.ph) * 6;
    const sq = Math.abs(Math.cos(S.t * 0.06 + c.ph));
    ctx.save();
    ctx.translate(c.x, cy); ctx.scale(0.35 + sq * 0.65, 1);
    ctx.fillStyle = '#ffd94d';
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
    ctx.fillStyle = '#a8842a';
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
    ctx.restore();
  }

  // particles
  for (const p of S.parts) {
    ctx.globalAlpha = Math.min(1, p.life / 25);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  drawCart(S.x, S.y, S.angle);

  ctx.restore();

  // HUD
  if (S.mode === 'play') {
    ctx.fillStyle = '#fff';
    ctx.font = '900 26px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(Math.floor(S.score).toLocaleString(), 18, 40);
    ctx.fillStyle = '#ffd94d';
    ctx.font = '900 18px Arial';
    ctx.fillText('◉ ' + S.coins, 18, 66);
    ctx.fillStyle = '#555';
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'right';
    ctx.fillText('BEST ' + S.best.toLocaleString(), W - 18, 36);
    // speed bar
    const sp = Math.min(1, (S.vx - 3) / 12);
    ctx.fillStyle = '#222'; ctx.fillRect(W - 158, 48, 140, 8);
    const grd = ctx.createLinearGradient(W - 158, 0, W - 18, 0);
    grd.addColorStop(0, '#7CFF6B'); grd.addColorStop(1, '#ff5b5b');
    ctx.fillStyle = grd; ctx.fillRect(W - 158, 48, 140 * sp, 8);
  }
}

/* ---------- the cart ---------- */
function drawCart(x, y, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(0, 30, 46, 8, 0, 0, 7); ctx.fill();

  // wheels
  const wheelSpin = S.x * 0.11;
  for (const wx of [-26, 26]) {
    ctx.save();
    ctx.translate(wx, 22);
    ctx.rotate(wheelSpin);
    ctx.fillStyle = '#1a1a1f';
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c9c9d4'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = '#6a6a75'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.rotate(Math.PI / 1.5);
      ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(0, 11); ctx.stroke();
    }
    ctx.restore();
  }

  // basket (chrome)
  const chrome = ctx.createLinearGradient(0, -34, 0, 8);
  chrome.addColorStop(0, '#f2f2f6'); chrome.addColorStop(0.5, '#a9a9b4'); chrome.addColorStop(1, '#6a6a75');
  ctx.strokeStyle = chrome; ctx.lineWidth = 4;
  // basket frame
  ctx.beginPath();
  ctx.moveTo(-34, -30); ctx.lineTo(34, -30); // top rim
  ctx.moveTo(-34, -30); ctx.lineTo(-24, 8);  // left side
  ctx.moveTo(34, -30); ctx.lineTo(24, 8);    // right side
  ctx.moveTo(-24, 8); ctx.lineTo(24, 8);     // bottom
  ctx.stroke();
  // basket grid lines
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(220,220,230,.55)';
  for (let i = 1; i < 4; i++) {
    const t = i / 4;
    ctx.beginPath();
    ctx.moveTo(-34 + t * 10, -30 + t * 38 * 0); ctx.lineTo(-34 + 68 * 1, -30);
    ctx.stroke();
  }
  for (let i = 1; i < 3; i++) {
    const y0 = -30 + i * 13;
    const wob = 34 - i * 3.4;
    ctx.beginPath(); ctx.moveTo(-wob, y0); ctx.lineTo(wob, y0); ctx.stroke();
  }
  // verticals
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 13.6, -30); ctx.lineTo(i * 9.6, 8); ctx.stroke();
  }
  // handle
  ctx.strokeStyle = chrome; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-38, -34); ctx.lineTo(-46, -46); ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.fillRect(-52, -52, 12, 8);

  // rider: little hooded gremlin
  ctx.fillStyle = '#0d0d12';
  ctx.beginPath(); ctx.arc(2, -44, 11, 0, 7); ctx.fill(); // head
  ctx.fillStyle = '#7CFF6B';
  ctx.fillRect(-3, -47, 10, 4); // visor
  ctx.strokeStyle = '#0d0d12'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(2, -34); ctx.lineTo(-6, -18); ctx.stroke(); // body
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-6, -20); ctx.lineTo(-30, -30); ctx.stroke(); // arm to handle

  ctx.restore();
}

/* ---------- loop ---------- */
let lastT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (S.mode === 'play') update();
  draw();
}
requestAnimationFrame(frame);

/* ---------- ui ---------- */
function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
  reset();
  S.mode = 'play';
}
document.getElementById('startBtn').onclick = startGame;
document.getElementById('retryBtn').onclick = startGame;
</script>
</body>
</html>
